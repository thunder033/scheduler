<mat-sidenav-container class="h-full">
  <mat-sidenav
    [class.collapsed]="isCollapsed()"
    [mode]="mode()"
    [opened]="isOpen()"
    (openedChange)="isOpen.set($event)"
  >
    <div class="flex h-full flex-col overflow-hidden">
      <header class="flex items-start justify-between gap-2 p-2">
        <div class="hide-when-collapsed flex flex-col gap-2 p-2">
          <span qa-title class="text-title-large">{{ title }}</span>
          <sch-current-user-tile />
        </div>
        @if (isDesktop()) {
          <button
            qa-collapse-toggle
            mat-icon-button
            [attr.aria-label]="collapseLabel()"
            (click)="toggleCollapsed()"
          >
            <mat-icon>{{ collapseIcon() }}</mat-icon>
          </button>
        }
      </header>

      <mat-nav-list qa-navigation class="flex-auto">
        @for (item of navItems(); track item.path) {
          <a
            mat-list-item
            routerLinkActive
            #link="routerLinkActive"
            [routerLink]="item.path"
            [routerLinkActiveOptions]="{ exact: true }"
            [activated]="link.isActive"
            [attr.aria-label]="isCollapsed() ? item.label : null"
            [matTooltip]="item.label"
            [matTooltipDisabled]="!isCollapsed()"
            matTooltipPosition="right"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle class="hide-when-collapsed">{{
              item.label
            }}</span>
          </a>
        }
      </mat-nav-list>

      <footer class="p-2">
        <sch-theme-menu />
      </footer>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (!isDesktop()) {
      <mat-toolbar>
        <button
          qa-navigation-toggle
          mat-icon-button
          [attr.aria-label]="toggleLabel"
          (click)="toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <span>{{ title }}</span>
      </mat-toolbar>
    }
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
