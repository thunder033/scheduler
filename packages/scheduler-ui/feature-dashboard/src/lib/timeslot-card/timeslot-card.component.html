<mat-card appearance="outlined">
  <mat-card-content>
    <div class="flex items-center justify-between">
      <span qa-time-range>{{ timeRange() }}</span>
      <button
        mat-icon-button
        type="button"
        qa-edit-toggle
        class="-my-2 -me-2"
        [class.active]="editing()"
        [attr.aria-label]="editLabel"
        [attr.aria-pressed]="editing()"
        (click)="toggleEditing()"
      >
        <mat-icon>edit</mat-icon>
      </button>
    </div>
    @if (editing()) {
    <div
      class="mt-2 flex flex-wrap gap-4 pt-2"
      (mousedown)="$event.stopPropagation()"
      (touchstart)="$event.stopPropagation()"
    >
      <mat-form-field
        qa-start-time
        class="flex-[1_1_8rem]"
        subscriptSizing="dynamic"
      >
        <mat-label>Start</mat-label>
        <input
          matInput
          type="time"
          [formField]="timesForm.start"
          [errorStateMatcher]="errorMatcher"
        />
        <mat-error>{{ timesForm.start().errors()[0]?.message }}</mat-error>
      </mat-form-field>
      <mat-form-field
        qa-end-time
        class="flex-[1_1_8rem]"
        subscriptSizing="dynamic"
      >
        <mat-label>End</mat-label>
        <input
          matInput
          type="time"
          [formField]="timesForm.end"
          [errorStateMatcher]="errorMatcher"
        />
        <mat-error>{{ timesForm.end().errors()[0]?.message }}</mat-error>
      </mat-form-field>
    </div>
    }
  </mat-card-content>
</mat-card>
