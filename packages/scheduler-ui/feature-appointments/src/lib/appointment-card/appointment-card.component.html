<div
  class="card flex flex-col items-start gap-2 rounded-lg border-1 border-solid border-outline-variant p-2 bg-surface"
>
  <header class="flex w-full justify-between p-1 pr-0">
    <span qa-time-range class="font-bold">{{ timeRange() }}</span>

    @if (isCoordinator()) {
      <button
        mat-icon-button
        type="button"
        qa-edit-appointment
        class="-my-2 -ms-2"
        [class.active]="expanded()"
        [attr.aria-label]="editLabel"
        [attr.aria-pressed]="expanded()"
        (click)="toggleEditing()"
      >
        <mat-icon>edit</mat-icon>
      </button>
    }
  </header>
  <lib-availability-select
    class="w-full"
    [compact]="true"
    [value]="chosen()"
    [placeholder]="placeholder"
    [disabled]="!canChange()"
    (valueChange)="choose($event)"
  />
  @if (expanded()) {
    <!-- What a coordinator edits is yet to be built -->
    <div
      class="content-expander w-full"
      qa-expandable-content
      (animate.enter)="expandContent($event)"
      (animate.leave)="collapseContent($event)"
    >
      <div class="content-clip"></div>
    </div>
  }
  @if (others().length) {
    <ul
      qa-other-availabilities
      class="m-0 flex w-full list-none flex-col gap-1 p-0"
    >
      @for (other of others(); track other.memberId) {
        <li>
          <lib-member-availability
            [name]="other.name"
            [status]="other.status"
          />
        </li>
      }
    </ul>
  }
</div>
