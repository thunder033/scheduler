<mat-form-field class="w-full" subscriptSizing="dynamic" floatLabel="always">
  <mat-label>{{ label }}</mat-label>
  <mat-select
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (selectionChange)="value.set($event.value)"
  >
    <mat-select-trigger>
      @if (value(); as status) {
        <sch-availability-status [status]="status" />
      }
    </mat-select-trigger>
    @for (status of statuses; track status) {
      <mat-option [value]="status">
        <sch-availability-status [status]="status" />
      </mat-option>
    }
  </mat-select>
</mat-form-field>
