<div class="flex flex-col items-center gap-2">
  <span qa-time-range class="font-bold">{{ timeRange() }}</span>
  @if (adding()) {
    <lib-availability-select
      class="w-full"
      [formField]="availabilityForm.status"
    />
    <button
      qa-save-availability
      mat-flat-button
      type="button"
      [disabled]="!canSave()"
      (click)="save()"
    >
      {{ saveLabel }}
    </button>
  } @else {
    <button
      qa-add-availability
      mat-flat-button
      type="button"
      (click)="startAdding()"
    >
      {{ addAvailabilityLabel }}
    </button>
  }
</div>
