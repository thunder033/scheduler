<div cdkDropListGroup>
  <div class="relative mb-4 flex items-center justify-between">
    <div>
      <h2 class="title">{{ title }}</h2>
      <p class="my-2">{{ description }}</p>
    </div>
    <button mat-button qa-new-timeslot (click)="startCreating()">
      <mat-icon fontIcon="add" />
      New timeslot
    </button>
    @if (floatingTimeslot(); as timeslot) {
      <div
        qa-floating-timeslot
        class="absolute right-0 top-full z-20 mt-2 w-64"
        cdkDropList
        [cdkDropListSortingDisabled]="true"
        [cdkDropListEnterPredicate]="neverEnter"
      >
        <sch-timeslot-card
          class="block"
          cdkDrag
          [cdkDragData]="timeslot"
          [timeslot]="timeslot"
        />
      </div>
    }
  </div>

  <div class="day-grid">
    @for (day of days(); track day.dayOfWeek) {
      <section
        qa-day
        [id]="day.elementId"
        class="day-column"
        cdkDropList
        [cdkDropListData]="day.dayOfWeek"
        [cdkDropListSortingDisabled]="true"
        (cdkDropListDropped)="drop($event)"
      >
        <h3 qa-day-label class="day-column-label">{{ day.label }}</h3>
        @for (timeslot of day.timeslots; track timeslot.timeslotId) {
          <sch-timeslot-card
            class="block"
            cdkDrag
            [cdkDragDisabled]="editingTimeslotId() !== timeslot.timeslotId"
            [cdkDragData]="timeslot"
            [timeslot]="timeslot"
          />
        }
      </section>
    }
  </div>
</div>
