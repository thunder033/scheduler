<mat-card appearance="outlined">
  <mat-card-content>
    <div
      qa-card-header
      cdkDragHandle
      class="flex items-center justify-between"
      [class.cursor-grab]="editing()"
    >
      <div class="flex items-center">
        @if (editing()) {
          <div class="handle-expander" (animate.enter)="wipeInHandle($event)">
            <div class="handle-clip">
              <mat-icon qa-drag-handle class="me-2" fontIcon="drag_indicator" />
            </div>
          </div>
        }
        <span qa-time-range>{{ timeRange() }}</span>
      </div>
      <button
        mat-icon-button
        type="button"
        qa-edit-toggle
        class="-my-2 -me-2"
        [class.active]="editing()"
        [attr.aria-label]="editLabel"
        [attr.aria-pressed]="editing()"
        (click)="toggleEditing()"
      >
        <mat-icon>{{ isNew() ? 'close' : 'edit' }}</mat-icon>
      </button>
    </div>
    @if (editing()) {
      <div
        class="content-expander"
        qa-expandable-content
        (animate.enter)="expandContent($event)"
        (animate.leave)="collapseContent($event)"
      >
        <div class="content-clip">
          <div
            class="mt-2 flex flex-wrap gap-4 pt-2"
            (mousedown)="$event.stopPropagation()"
            (touchstart)="$event.stopPropagation()"
          >
            <mat-form-field
              qa-start-time
              class="flex-[1_1_8rem]"
              subscriptSizing="dynamic"
            >
              <mat-label>Start</mat-label>
              <input
                matInput
                type="time"
                [formField]="timesForm.start"
                [errorStateMatcher]="errorMatcher"
              />
              <mat-error>{{
                timesForm.start().errors()[0]?.message
              }}</mat-error>
            </mat-form-field>
            <mat-form-field
              qa-end-time
              class="flex-[1_1_8rem]"
              subscriptSizing="dynamic"
            >
              <mat-label>End</mat-label>
              <input
                matInput
                type="time"
                [formField]="timesForm.end"
                [errorStateMatcher]="errorMatcher"
              />
              <mat-error>{{ timesForm.end().errors()[0]?.message }}</mat-error>
            </mat-form-field>
            <div class="flex basis-full items-center justify-between">
              @if (!isNew()) {
                <button
                  mat-icon-button
                  type="button"
                  qa-delete
                  class="-ms-2"
                  [attr.aria-label]="deleteLabel"
                  (click)="confirmDelete()"
                >
                  <mat-icon>delete</mat-icon>
                </button>
              }
              <button
                mat-flat-button
                type="button"
                qa-save
                class="ms-auto"
                [disabled]="!canSave()"
                (click)="save()"
              >
                Save
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </mat-card-content>
</mat-card>
